[package]
name = "subwy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
subwy-project.workspace = true
anyhow.workspace = true
lsp-types.workspace = true
serde_json.workspace = true
smol.workspace = true
# The grammars subwy highlights; json comes with the base tree-sitter feature.
gpui-kit = { workspace = true, features = [
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-rust",
    "tree-sitter-kotlin",
    "tree-sitter-java",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-javascript",
    "tree-sitter-yaml",
    "tree-sitter-toml",
    "tree-sitter-sql",
    "tree-sitter-bash",
    "tree-sitter-python",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-css",
] }
gpui-pre-platform.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile.workspace = true

# Offscreen UI checks with real rendering; AppKit needs the main thread, so no test harness.
[[test]]
name = "visual"
path = "tests/visual/main.rs"
harness = false
